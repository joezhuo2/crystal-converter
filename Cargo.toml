[package]
name = "crystal-converter"
version = "0.1.1"
edition = "2021"
description = "Hold a hotkey while dragging a file to convert it from a radial wheel"
license = "MIT"
repository = "https://github.com/joezhuo2/crystal-converter"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
tiny-skia = "0.12"
tray-icon = "0.26"
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Data_Pdf",
  "Foundation",
  "Graphics_Imaging",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
