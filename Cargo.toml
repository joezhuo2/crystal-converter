[package]
name = "crystal-converter"
version = "0.1.0"
edition = "2021"
description = "Hold a hotkey while dragging a file to convert it from a radial wheel"
license = "MIT"
repository = "https://github.com/joezhuo2/crystal-converter"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
